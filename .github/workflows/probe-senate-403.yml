# 임시 진단용. 상원 EFD 403 의 성격을 파악한다. 확인 후 삭제.
#
# 차단을 뚫으려는 것이 아니라 사이트의 입장을 읽는 것이 목적이다.
# robots.txt 와 403 본문이 자동 접근 금지를 명시하면, 대응은 수집 중단이다.
# 요청은 현재 코드가 쓰는 UA 하나로만, 경로별 1회씩 보낸다.
name: probe-senate-403

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python - <<'PY'
          import time
          import requests
          import senate_efd

          BASE = senate_efd.BASE
          UA = senate_efd.UA          # 현재 코드가 쓰는 그 UA 그대로
          INTEREST = ("server", "cf-ray", "cf-mitigated", "x-amzn-waf-action",
                      "x-cache", "retry-after", "content-type",
                      "x-frame-options", "via", "connection")

          def probe(path):
              url = BASE + path
              try:
                  r = requests.get(url, headers={"User-Agent": UA},
                                   timeout=30, allow_redirects=False)
              except Exception as e:
                  print(f"  {path:<16} EXC {type(e).__name__}: {e}", flush=True)
                  return None
              hdr = "  ".join(f"{k}={r.headers[k][:48]!r}"
                              for k in INTEREST if k in r.headers)
              print(f"  {path:<16} {r.status_code}  len={len(r.content):>6}  {hdr}",
                    flush=True)
              return r

          print(f"=== UA: {UA!r} ===", flush=True)
          print("\n=== 1. 어디까지 막혔나 (호스트 전체 vs 특정 경로) ===", flush=True)
          seen = {}
          for path in ("/robots.txt", "/", "/search/", "/search/home/"):
              seen[path] = probe(path)
              time.sleep(2)

          print("\n=== 2. robots.txt (사이트가 명시한 정책) ===", flush=True)
          rb = seen.get("/robots.txt")
          if rb is not None and rb.status_code == 200:
              print(rb.text[:1200] or "<비어 있음>", flush=True)
          else:
              print("  가져오지 못함", flush=True)

          print("\n=== 3. 차단 응답 본문 (차단 주체·사유) ===", flush=True)
          blocked = next((r for p, r in seen.items()
                          if r is not None and r.status_code == 403), None)
          if blocked is None:
              print("  403 이 재현되지 않음 — 간헐적이었거나 이미 해제됨", flush=True)
          else:
              body = blocked.text[:1200]
              print(body.strip() or "<본문 없음>", flush=True)
              low = body.lower()
              hits = [s for s in ("cloudflare", "akamai", "incapsula", "imperva",
                                  "aws waf", "captcha", "ray id", "access denied",
                                  "automated", "scraping", "robot", "bot",
                                  "terms of use", "unauthorized")
                      if s in low]
              print(f"\n  [본문 서명] {hits or '없음'}", flush=True)
          PY
