name: insider-feed

on:
  schedule:
    # 05:30 UTC = 미 동부 01:30. Form 4 마감 22:00 ET 이후라 인덱스가 이미 있다.
    #
    # 다만 실제 실행은 이 시각이 아니다. 관측된 10회 연속 09:28-10:15 UTC 로,
    # 평균 4.4시간(최소 4.0) 늦게 돈다. GitHub 스케줄러의 상시 지연이고 이 설정을
    # 앞당겨도 달라지지 않는다. 대상 날짜는 시계가 아니라 달력일에서 뽑으므로
    # (_prev_business_day) 지연이 4시간이든 0이든 같은 영업일을 조회한다.
    # 텔레그램 도착 시각만 미 동부 새벽 1시대가 아니라 오전 5-6시대가 된다.
    - cron: "30 5 * * 2-6"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # 의회 공시 중복 발송 방지용 상태. 키에 run_id를 넣어 매번 새로 저장하고,
      # restore-keys 로 직전 실행분을 복원한다.
      - uses: actions/cache@v6
        with:
          path: .state
          key: insider-feed-state-${{ github.run_id }}
          restore-keys: insider-feed-state-

      - run: python insider_feed.py
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
