# 임시 검증용. senate_efd 모듈을 실제 EFD 상대로 돌려 결과를 로그로 남긴다.
# 확인이 끝나면 이 파일은 삭제한다. 수동 실행 전용.
name: probe-senate

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import datetime as dt
          import senate_efd as se

          since = dt.date.today() - dt.timedelta(days=30)
          print(f"=== collect_senate(since={since}) ===", flush=True)
          rows, scanned, fetched = se.collect_senate(since)
          print(f"rows={len(rows)} scanned={len(scanned)} fetched={len(fetched)}", flush=True)

          for r in rows[:12]:
              print(f"  {r['ticker']:<6} {r['type']:<9} {r['asset_type']:<20} "
                    f"{r['amount']:<22} min={r['value_min']:>10,.0f} "
                    f"traded={r['traded']} who={r['who']}", flush=True)
          for f_ in scanned[:5]:
              print(f"  [지면] {f_['who']} {f_['filed']} {f_['url']}", flush=True)

          print("\n=== 행 형태 점검 ===", flush=True)
          if rows:
              import house_ptr
              need = {"chamber", "doc_id", "who", "district", "filed", "link",
                      "key", "ticker", "type", "traded", "amount",
                      "value", "value_min"}
              missing = need - set(rows[0])
              print(f"누락 키: {missing or '없음'}", flush=True)
              print(f"key 예시: {rows[0]['key']}", flush=True)

          print("\n=== 두 번째 호출: 처리 완료 문서 건너뛰기 ===", flush=True)
          rows2, scanned2, fetched2 = se.collect_senate(since, skip_docs=fetched)
          print(f"rows={len(rows2)} scanned={len(scanned2)} fetched={len(fetched2)}"
                "  <- 모두 0 이어야 한다", flush=True)

          print("\n=== 필터 통과분 (CONGRESS_MIN_AMOUNT 하단 기준) ===", flush=True)
          kept = [r for r in rows if r["value_min"] >= 15_000]
          print(f"{len(kept)}/{len(rows)} 건", flush=True)
          PY
