# 임시 진단용. 현재 표시되는 변화율 중 '다중 보유 풀' 때문에 틀린 것이
# 몇 건인지 센다. 그리고 natureOfOwnership 이 풀 식별자로 쓸 만한지 본다.
# 확인 후 삭제.
name: probe-stake-gap

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import collections, datetime as dt, re
          import xml.etree.ElementTree as ET
          import insider_feed as f

          DATE = dt.date(2026, 10, 30)
          paths = f.form4_filings(DATE)
          print(f"=== {DATE} Form 4 제출 {len(paths)}건 ===", flush=True)

          SOFT = "postTransactionAmounts/sharesOwnedFollowingTransaction/value"
          DI = "ownershipNature/directOrIndirectOwnership/value"
          NAT = "ownershipNature/natureOfOwnership/value"

          groups = collections.defaultdict(list)   # (src,ticker,code) -> 문서 순서 행
          for path in paths:
              try:
                  rawtxt = f._get(f"https://www.sec.gov/Archives/{path}").text
              except Exception:
                  continue
              m = re.search(r"<ownershipDocument>.*?</ownershipDocument>", rawtxt, re.S)
              if not m:
                  continue
              try:
                  doc = ET.fromstring(m.group(0))
              except ET.ParseError:
                  continue
              tk = (doc.findtext("issuer/issuerTradingSymbol") or "").strip().upper()
              if not re.fullmatch(r"[A-Z][A-Z0-9.\-]{0,5}", tk) or tk in ("N/A", "NONE"):
                  continue
              src = path.rsplit("/", 1)[-1].rsplit(".", 1)[0]
              for t in doc.findall("nonDerivativeTable/nonDerivativeTransaction"):
                  code = t.findtext("transactionCoding/transactionCode")
                  if code not in ("P", "S"):
                      continue
                  sh = t.findtext("transactionAmounts/transactionShares/value")
                  px = t.findtext("transactionAmounts/transactionPricePerShare/value")
                  if not sh or not px:
                      continue
                  if f.NON_COMMON_RE.search(t.findtext("securityTitle/value") or ""):
                      continue
                  try:
                      sh, px = float(sh), float(px)
                  except ValueError:
                      continue
                  if sh * px <= 0:
                      continue
                  a = t.findtext(SOFT)
                  try:
                      a = float(a) if a else None
                  except ValueError:
                      a = None
                  groups[(src, tk, code)].append({
                      "code": code, "shares": sh, "value": sh * px, "after": a,
                      "di": (t.findtext(DI) or "").strip().upper(),
                      "nat": (t.findtext(NAT) or "").strip(),
                  })

          def single_pool(rs):
              """한 풀의 연속 체결이면 잔고 변화량이 거래량과 맞아떨어진다."""
              if any(r["after"] is None for r in rs):
                  return None
              for prev, cur in zip(rs, rs[1:]):
                  d = cur["after"] - prev["after"]
                  want = cur["shares"] if cur["code"] == "P" else -cur["shares"]
                  if abs(d - want) > 0.5:
                      return False
              return True

          stat = collections.Counter()
          wrong, natinfo = [], []
          for key, rs in groups.items():
              tot = sum(r["shares"] for r in rs)
              val = sum(r["value"] for r in rs)
              last = rs[-1]["after"]
              code = rs[0]["code"]
              # 현재 코드가 내는 값 (섞임 억제 포함)
              cur_after = None if len({r["di"] for r in rs}) > 1 else last
              cur_before, cur_stake = f._stake(code, tot, cur_after)
              shown = f.stake_str({"code": code, "shares": tot, "after": cur_after,
                                   "before": cur_before, "stake": cur_stake,
                                   "direct": None})
              if len(rs) == 1:
                  stat["행 1건 (문제없음)"] += 1
                  continue
              sp = single_pool(rs)
              if sp is None:
                  stat["보유량 누락"] += 1
              elif sp:
                  stat["다중행·단일 풀 (현재 계산 맞음)"] += 1
              else:
                  stat["다중행·다중 풀"] += 1
                  if shown:
                      stat["  └ 현재 변화율을 표시 중 (오표시)"] += 1
                      # 풀별 합산이 내는 올바른 값
                      pools = collections.defaultdict(list)
                      for r in rs:
                          pools[(r["di"], r["nat"])].append(r)
                      bsum = 0.0
                      for prs in pools.values():
                          psh = sum(x["shares"] for x in prs)
                          pa = prs[-1]["after"]
                          bsum += (pa - psh) if code == "P" else (pa + psh)
                      ok = (tot / bsum * 100 * (1 if code == "P" else -1)) if bsum > 0 else None
                      wrong.append((key[1], code, f"${val/1e6:.1f}M", shown,
                                    f"{ok:+.0f}%" if ok is not None else "계산불가",
                                    len(pools), len(rs)))
                  else:
                      stat["  └ 가드에 걸려 누락 (RAPP 같은 경우)"] += 1
                  natinfo.append((key[1], code, len(rs),
                                  len({(r["di"], r["nat"]) for r in rs}),
                                  [r["nat"][:34] for r in rs]))

          print(f"\n=== 병합 그룹 {len(groups)}건 분류 ===", flush=True)
          for k in ("행 1건 (문제없음)", "다중행·단일 풀 (현재 계산 맞음)",
                    "다중행·다중 풀", "  └ 현재 변화율을 표시 중 (오표시)",
                    "  └ 가드에 걸려 누락 (RAPP 같은 경우)", "보유량 누락"):
              if k in stat:
                  print(f"  {k:<42} {stat[k]}", flush=True)

          print(f"\n=== 오표시 상세 (티커, 코드, 금액, 현재값, 풀별합산값, 풀수, 행수) ===", flush=True)
          for w in wrong[:20]:
              print(f"  {w}", flush=True)
          if not wrong:
              print("  없음", flush=True)

          print(f"\n=== natureOfOwnership 이 풀을 가르는가 ===", flush=True)
          print(f"  (티커, 코드, 행수, (di,nat) 조합수, nat 값들)", flush=True)
          for n in natinfo[:12]:
              print(f"  {n}", flush=True)
          PY
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
