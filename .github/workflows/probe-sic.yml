# 임시 탐색용. 티커 -> CIK 소스 두 개의 커버리지를 비교한다. 확인 후 삭제.
name: probe-sic

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python - <<'PY'
          import os, requests
          s = requests.Session()
          s.headers["User-Agent"] = os.environ["SEC_UA"]

          def load(url, shape):
              r = s.get(url, timeout=60); r.raise_for_status()
              j = r.json()
              if shape == "dict":
                  d = {v["ticker"].upper(): v["cik_str"] for v in j.values()}
              else:
                  cols = [c.lower() for c in j["fields"]]
                  ti, ci = cols.index("ticker"), cols.index("cik")
                  d = {row[ti].upper(): row[ci] for row in j["data"] if row[ti]}
              print(f"{url.rsplit('/',1)[-1]:<34} {len(r.content)/1e6:>5.1f}MB  티커 {len(d):,}", flush=True)
              return d

          a = load("https://www.sec.gov/files/company_tickers.json", "dict")
          b = load("https://www.sec.gov/files/company_tickers_exchange.json", "table")

          # 실제 피드에 등장한 티커 + 의회 거래에 흔한 대형주
          REAL = ["WMB","EA","AVB","JNJ","CEG","OTIS","IVV","IJR","AVUV","SPYM","WWSYX"]
          COMMON = ["AAPL","MSFT","NVDA","AMZN","GOOGL","META","TSLA","JPM","BAC","LMT",
                    "RTX","NOC","GD","BA","PFE","MRK","ABBV","UNH","CVX","XOM","COP",
                    "NEE","DUK","SO","T","VZ","TMUS","DE","ADM","TSN","PLD","AMT","SPG"]
          print(flush=True)
          for label, ts in (("실측 등장", REAL), ("흔한 대형주", COMMON)):
              ma = [t for t in ts if t in a]
              mb = [t for t in ts if t in b]
              print(f"[{label}] n={len(ts)}  company_tickers={len(ma)}  exchange={len(mb)}", flush=True)
              print(f"   company_tickers 누락: {sorted(set(ts)-set(ma))}", flush=True)
              print(f"   exchange 누락:        {sorted(set(ts)-set(mb))}", flush=True)

          only_b = set(b) - set(a)
          print(f"\nexchange 에만 있는 티커 수: {len(only_b):,}", flush=True)
          print(f"둘의 합집합: {len(set(a)|set(b)):,}", flush=True)
          PY
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
