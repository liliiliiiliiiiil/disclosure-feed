# 임시 검증용. 교차참조 전체 사슬을 실제 데이터로 돌린다. 확인 후 삭제.
name: probe-sic

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import datetime as dt
          import insider_feed as f
          import senate_efd, house_ptr, committee_overlap

          since = dt.date.today() - dt.timedelta(days=30)
          rows, scanned, fetched = senate_efd.collect_senate(since)
          hrows, hscanned, hfetched = house_ptr.collect_house(since)
          rows += hrows
          print(f"\n총 거래 {len(rows)}건 (상원 {len(rows)-len(hrows)} / 하원 {len(hrows)})", flush=True)

          eligible = f.filter_congress(rows)
          print(f"필터 통과 {len(eligible)}건", flush=True)

          sic = {}
          f.annotate_overlap(eligible, sic)
          print(f"SIC 캐시 {len(sic)}개 확보", flush=True)

          hit = [r for r in eligible if r.get("overlap")]
          print(f"\n=== 교차참조 적중 {len(hit)}/{len(eligible)} ===", flush=True)
          for r in hit:
              ov = " · ".join(f"{l}{'★' if c else ''}" for l, c in r["overlap"])
              print(f"  {r['ticker']:<6} {r['type']:<9} {r['who']:<26} "
                    f"sic={sic.get(r['ticker'],''):<5} ⚖️ {ov}", flush=True)

          print("\n=== 업종은 알지만 안 겹친 건 (상위 12) ===", flush=True)
          n = 0
          for r in eligible:
              s = committee_overlap.sector_of_sic(sic.get(r["ticker"], ""))
              if s and not r.get("overlap"):
                  print(f"  {r['ticker']:<6} {s:<12} {r['who']}", flush=True)
                  n += 1
                  if n >= 12:
                      break

          unresolved = sorted({r["ticker"] for r in eligible if not sic.get(r["ticker"])})
          print(f"\n업종 판정 불가 티커 {len(unresolved)}개: {unresolved[:25]}", flush=True)
          PY
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
